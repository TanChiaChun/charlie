name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_vue:
        required: true
        type: boolean
        default: true
      run_python:
        required: true
        type: boolean
        default: true
      run_markdown:
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  vue:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_vue }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: TanChiaChun/git-hooks/.github/workflows/workflows-vue.yml@main
    with:
      os: ${{ matrix.os }}
  python:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_python }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: TanChiaChun/git-hooks/.github/workflows/workflows-python.yml@main
    with:
      os: ${{ matrix.os }}
      submodules: true
  markdown:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_markdown }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: TanChiaChun/git-hooks/.github/workflows/workflows-markdown.yml@main
    with:
      os: ${{ matrix.os }}
      submodules: true
