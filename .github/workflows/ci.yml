name: CI
on: push
permissions:
  contents: read
jobs:
  vue:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: TanChiaChun/git-hooks/.github/workflows/workflows-vue.yml@main
    with:
      os: ${{ matrix.os }}
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: TanChiaChun/git-hooks/.github/workflows/workflows-python.yml@main
    with:
      os: ${{ matrix.os }}
      submodules: true
  markdown:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: TanChiaChun/git-hooks/.github/workflows/workflows-markdown.yml@main
    with:
      os: ${{ matrix.os }}
      submodules: true
